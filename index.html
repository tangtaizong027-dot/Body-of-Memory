<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>照片球體畫廊 · 單機完美版</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f1f4f9; color: #2b3445; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  #stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; touch-action: none; background: radial-gradient(circle at 50% 40%, #ffffff 0%, #f0f4fa 55%, #e3eaf4 100%); }
  #c { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; transition: opacity .3s ease; }
  #hud.dim { opacity: 0; }
  .pill { font-size: 12.5px; letter-spacing: .3px; color: #6b7a92; background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.9); padding: 6px 14px; border-radius: 999px; backdrop-filter: blur(10px); box-shadow: 0 2px 10px rgba(60,80,120,.08); }
  #empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 15px; color: #7a879c; pointer-events: none; text-align: center; }
  #empty span { font-size: 12.5px; color: #9aa6b8; }
  #empty.hidden { display: none; }
  #progress { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: 70%; max-width: 320px; background: rgba(255,255,255,.86); border: 1px solid rgba(255,255,255,.95); border-radius: 12px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(60,80,120,.12); backdrop-filter: blur(10px); pointer-events: none; transition: opacity .3s ease; }
  #progress.hidden { opacity: 0; }
  .progress-bar { height: 4px; border-radius: 2px; background: #e3e9f2; overflow: hidden; }
  #progressFill { height: 100%; width: 0%; background: linear-gradient(90deg, #5b8def, #8a6bf5); border-radius: 2px; transition: width .2s ease; }
  #progressText { margin-top: 6px; font-size: 11.5px; color: #7a879c; text-align: center; }
  #panel { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); background: #ffffff; border-top: 1px solid #e5ebf3; flex-wrap: wrap; }
  .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .count { font-size: 14px; color: #5a6880; }
  .count b { color: #1f2a3d; font-size: 17px; margin-right: 2px; }
  .sel { font-size: 12px; color: #8a97aa; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { appearance: none; border: 1px solid #dde4ee; background: #f7f9fc; color: #4a5870; font: inherit; font-size: 13px; padding: 8px 14px; border-radius: 9px; cursor: pointer; transition: background .18s ease, border-color .18s ease, transform .1s ease; white-space: nowrap; }
  .btn:hover { background: #eef2f8; border-color: #cfd8e6; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: linear-gradient(135deg, #5b8def, #8a6bf5); border-color: transparent; color: #fff; font-weight: 600; box-shadow: 0 4px 14px rgba(91,141,239,.28); }
  #overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; pointer-events: none; background: rgba(240,244,250,0); transition: background .38s ease; }
  #overlay.active { pointer-events: auto; background: rgba(240,244,250,.88); backdrop-filter: blur(14px); }
  #floatImg { display: block; border-radius: 10px; box-shadow: 0 30px 80px rgba(60,80,120,.28), 0 0 0 1px rgba(255,255,255,.9); will-change: transform, opacity; pointer-events: none; -webkit-user-drag: none; user-select: none; background: #fff; }
  #overlay.active #floatImg { pointer-events: auto; cursor: zoom-out; }
  #floatMeta { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); font-size: 12.5px; color: #7a879c; opacity: 0; transition: opacity .3s ease .2s; pointer-events: none; white-space: nowrap; }
  #overlay.active #floatMeta { opacity: 1; }
  @media (max-width: 560px) {
    #panel { padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px)); }
    .actions { width: 100%; justify-content: space-between; }
    .btn { flex: 1 1 auto; text-align: center; padding: 9px 8px; font-size: 12.5px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud"><div class="pill">拖曳旋轉 · 點擊浮出 · 雙擊返回</div></div>
    <div id="empty">還沒有照片<span>點擊下方「上傳照片」開始（照片會自動保存在本地）</span></div>
    <div id="progress" class="hidden">
      <div class="progress-bar"><div id="progressFill"></div></div>
      <div id="progressText"></div>
    </div>
  </div>
  <div id="panel">
    <div class="info">
      <div class="count"><b id="count">0</b>張照片</div>
      <div class="sel" id="selInfo">尚未選取</div>
    </div>
    <div class="actions">
      <label class="btn primary">＋ 上傳照片<input id="file" type="file" accept="image/*" multiple hidden /></label>
      <button class="btn" id="btnAuto">自動旋轉 ON</button>
      <button class="btn" id="btnReset">重置視角</button>
      <button class="btn" id="btnClear">清空</button>
    </div>
  </div>
</div>

<div id="overlay">
  <img id="floatImg" alt="" />
  <div id="floatMeta"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

const RADIUS = 3;

/* ============ DOM ============ */
const stage     = document.getElementById('stage');
const canvas    = document.getElementById('c');
const fileInput = document.getElementById('file');
const countEl   = document.getElementById('count');
const selEl     = document.getElementById('selInfo');
const emptyEl   = document.getElementById('empty');
const overlay   = document.getElementById('overlay');
const floatImg  = document.getElementById('floatImg');
const floatMeta = document.getElementById('floatMeta');
const hud       = document.getElementById('hud');
const progressEl   = document.getElementById('progress');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');

/* ============ Three.js 基礎 ============ */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 2000);
const pivot  = new THREE.Group();
scene.add(pivot);

/* ============ 狀態 ============ */
let photos = [];
let meshes = [];

let dragging = false;
let pointerDown = false;
let movedDist = 0;
let lastPX = 0, lastPY = 0;
let velX = 0, velY = 0;
let autoRotate = true;
let zoom = 1;
let baseDist = 8;

let floating = false;
let returning = false;
let selectedPhoto = null;
let floatOrigin = { x: 0, y: 0 };

let pendingFiles = [];

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ============ IndexedDB 本地儲存 ============ */
let db = null;
function initDB() {
  return new Promise((resolve) => {
    const req = indexedDB.open('LocalPhotoGallery', 1);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('photos')) {
        database.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(); };
    req.onerror = () => { console.warn('IndexedDB 無法使用'); resolve(); };
  });
}

function saveToDB(data) {
  if (!db) return;
  const tx = db.transaction('photos', 'readwrite');
  tx.objectStore('photos').put(data);
}

function clearDB() {
  if (!db) return;
  const tx = db.transaction('photos', 'readwrite');
  tx.objectStore('photos').clear();
}

function loadFromDB() {
  return new Promise((resolve) => {
    if (!db) return resolve([]);
    const tx = db.transaction('photos', 'readonly');
    const req = tx.objectStore('photos').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => resolve([]);
  });
}

/* ============ 布局邏輯 ============ */
function rebuildSphere() {
  for (const p of photos) {
    if (p.mesh) {
      pivot.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      if (p.texture) p.texture.dispose();
    }
  }
  photos = [];
  meshes = [];

  const n = pendingFiles.length;
  emptyEl.classList.toggle('hidden', n > 0);
  countEl.textContent = n;
  if (!n) return;

  const golden = Math.PI * (3 - Math.sqrt(5));
  const baseSize = Math.max(0.4, Math.min(0.9, 8.0 / Math.sqrt(n)));

  for (let i = 0; i < n; i++) {
    const file = pendingFiles[i];
    const aspect = file.aspect || 1;

    const y = n === 1 ? 0 : 1 - (i / (n - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = golden * i;
    
    const dir = new THREE.Vector3(Math.cos(theta) * r, y, Math.sin(theta) * r).normalize();
    const pos = dir.clone().multiplyScalar(RADIUS);

    let w, h;
    if (aspect >= 1) { w = baseSize; h = baseSize / aspect; }
    else             { h = baseSize; w = baseSize * aspect; }

    const geo = new THREE.PlaneGeometry(w, h);
    const mat = new THREE.MeshBasicMaterial({
      map: file.texture,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 1,
    });

    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(pos);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
    pivot.add(mesh);
    
    const photoData = {
      mesh, texture: file.texture, 
      thumbUrl: file.thumbUrl, displayUrl: file.displayUrl,
      aspect, name: file.name, pos, normal: dir, w, h
    };
    photos.push(photoData);
    meshes.push(mesh);
  }
}

/* ============ 上傳與圖片處理 ============ */
fileInput.addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  e.target.value = '';

  progressEl.classList.remove('hidden');
  let current = 0;

  for (const file of files) {
    progressText.textContent = `處理中 ${current + 1} / ${files.length}`;
    progressFill.style.width = `${(current / files.length) * 100}%`;

    try {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.src = url;
      await new Promise((resolve, reject) => {
        img.onload = resolve;
        img.onerror = reject;
      });

      // 1. 生成球面縮圖 (最大邊 512px)
      const scaleThumb = Math.min(1, 512 / Math.max(img.width, img.height));
      const tw = Math.max(1, Math.round(img.width * scaleThumb));
      const th = Math.max(1, Math.round(img.height * scaleThumb));
      const cvThumb = document.createElement('canvas');
      cvThumb.width = tw; cvThumb.height = th;
      cvThumb.getContext('2d').drawImage(img, 0, 0, tw, th);
      const thumbUrl = cvThumb.toDataURL('image/jpeg', 0.85);

      // 2. 生成點擊大圖 (最大邊 1024px)
      const scaleDisplay = Math.min(1, 1024 / Math.max(img.width, img.height));
      const dw = Math.max(1, Math.round(img.width * scaleDisplay));
      const dh = Math.max(1, Math.round(img.height * scaleDisplay));
      const cvDisplay = document.createElement('canvas');
      cvDisplay.width = dw; cvDisplay.height = dh;
      cvDisplay.getContext('2d').drawImage(img, 0, 0, dw, dh);
      const displayUrl = cvDisplay.toDataURL('image/jpeg', 0.9);

      const tex = new THREE.CanvasTexture(cvThumb);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

      const photoData = {
        texture: tex, thumbUrl, displayUrl,
        aspect: img.width / img.height, name: file.name
      };

      pendingFiles.push(photoData);
      
      // 存入 IndexedDB (不存 texture，因為無法直接存，存 url 即可)
      saveToDB({ thumbUrl, displayUrl, aspect: photoData.aspect, name: photoData.name });

      URL.revokeObjectURL(url);
      current++;
    } catch (err) {
      console.warn('讀取圖片失敗', err);
    }
  }

  progressFill.style.width = '100%';
  setTimeout(() => progressEl.classList.add('hidden'), 500);

  rebuildSphere();
  updateUI();
});

/* ============ UI ============ */
function updateUI() {
  selEl.textContent = selectedPhoto ? (selectedPhoto.name || '已選取照片') : '尚未選取';
}

/* ============ 拾取 ============ */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();

function pick(cx, cy) {
  if (!meshes.length) return null;
  const rect = stage.getBoundingClientRect();
  pointerNDC.x = ((cx - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((cy - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(meshes, false);

  if (hits.length > 0) {
    return photos.find(p => p.mesh === hits[0].object);
  }
  return null;
}

/* ============ 浮出 ============ */
async function floatPhoto(photo, cx, cy) {
  if (floating) return;
  floating = true;
  selectedPhoto = photo;
  velX = velY = 0;

  floatImg.src = photo.displayUrl;
  floatMeta.textContent = `${photo.name || '照片'} · 雙擊或按 ESC 返回`;

  const maxW = Math.min(window.innerWidth * 0.86, 1200);
  const maxH = window.innerHeight * 0.68;
  let w = maxW;
  let h = w / photo.aspect;
  if (h > maxH) { h = maxH; w = h * photo.aspect; }
  floatImg.style.width = w + 'px';
  floatImg.style.height = h + 'px';

  const dx = cx - window.innerWidth / 2;
  const dy = cy - window.innerHeight / 2;
  floatOrigin.x = cx;
  floatOrigin.y = cy;

  floatImg.style.transition = 'none';
  floatImg.style.transform = `translate(${dx}px, ${dy}px) scale(0.06)`;
  floatImg.style.opacity = '0';
  void floatImg.offsetWidth;
  floatImg.style.transition = 'transform .55s cubic-bezier(.22,1,.36,1), opacity .3s ease';
  floatImg.style.transform = 'translate(0px, 0px) scale(1)';
  floatImg.style.opacity = '1';

  overlay.classList.add('active');
  hud.classList.add('dim');
  updateUI();
}

function returnPhoto() {
  if (!floating || returning) return;
  returning = true;

  const dx = floatOrigin.x - window.innerWidth / 2;
  const dy = floatOrigin.y - window.innerHeight / 2;

  floatImg.style.transition = 'transform .5s cubic-bezier(.5,0,.75,0), opacity .34s ease .12s';
  floatImg.style.transform = `translate(${dx}px, ${dy}px) scale(0.05)`;
  floatImg.style.opacity = '0';

  overlay.classList.remove('active');
  hud.classList.remove('dim');

  setTimeout(() => {
    floating = false;
    returning = false;
    selectedPhoto = null;
    floatImg.removeAttribute('src');
    updateUI();
  }, 520);
}

/* ============ 互動事件 ============ */
stage.addEventListener('pointerdown', (e) => {
  if (floating) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;

  pointerDown = true;
  dragging = true;
  movedDist = 0;
  lastPX = e.clientX;
  lastPY = e.clientY;
  velX = velY = 0;
  stage.style.cursor = 'grabbing';
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
});

stage.addEventListener('pointermove', (e) => {
  if (dragging) {
    const dx = e.clientX - lastPX;
    const dy = e.clientY - lastPY;
    lastPX = e.clientX;
    lastPY = e.clientY;

    movedDist += Math.abs(dx) + Math.abs(dy);

    pivot.rotation.y += dx * 0.006;
    pivot.rotation.x = clamp(pivot.rotation.x + dy * 0.006, -1.25, 1.25);

    velY = dx * 0.006;
    velX = dy * 0.006;
  }
});

stage.addEventListener('pointerup', (e) => {
  if (!pointerDown) return;
  pointerDown = false;
  dragging = false;
  stage.style.cursor = 'grab';
  try { stage.releasePointerCapture(e.pointerId); } catch (_) {}

  if (movedDist < 9 && !floating) {
    const p = pick(e.clientX, e.clientY);
    if (p) floatPhoto(p, e.clientX, e.clientY);
  }
});

stage.addEventListener('pointercancel', () => {
  pointerDown = false;
  dragging = false;
  stage.style.cursor = 'grab';
});

stage.addEventListener('wheel', (e) => {
  if (floating) return;
  e.preventDefault();
  zoom = clamp(zoom * Math.exp(e.deltaY * 0.0012), 0.6, 1.9);
  camera.position.z = baseDist * zoom;
  camera.lookAt(0, 0, 0);
}, { passive: false });

overlay.addEventListener('pointerdown', (e) => {
  if (e.target === floatImg) return;
  returnPhoto();
});

let lastTap = 0;
floatImg.addEventListener('pointerup', () => {
  const now = performance.now();
  if (now - lastTap < 340) {
    lastTap = 0;
    returnPhoto();
  } else {
    lastTap = now;
  }
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') returnPhoto();
});

/* ============ 按鈕 ============ */
document.getElementById('btnAuto').addEventListener('click', (e) => {
  autoRotate = !autoRotate;
  e.currentTarget.textContent = autoRotate ? '自動旋轉 ON' : '自動旋轉 OFF';
});

document.getElementById('btnReset').addEventListener('click', () => {
  pivot.rotation.set(0, 0, 0);
  velX = velY = 0;
  zoom = 1;
  camera.position.z = baseDist;
  camera.lookAt(0, 0, 0);
});

document.getElementById('btnClear').addEventListener('click', () => {
  if (!pendingFiles.length) return;
  if (!window.confirm('確定要清空所有照片嗎？')) return;
  
  pendingFiles = [];
  clearDB(); // 清空本地資料庫
  rebuildSphere();
  updateUI();
});

/* ============ 尺寸與主迴圈 ============ */
function resize() {
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  if (!w || !h) return;

  renderer.setSize(w, h, false);
  camera.aspect = w / h;

  const vFov = THREE.MathUtils.degToRad(camera.fov);
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  const fov = Math.min(vFov, hFov);

  baseDist = (RADIUS * 1.2) / Math.tan(fov / 2);
  camera.position.set(0, 0, baseDist * zoom);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}

let lastT = performance.now();
function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const step = dt * 60;

  if (!dragging && !floating) {
    if (Math.abs(velY) > 0.0001 || Math.abs(velX) > 0.0001) {
      pivot.rotation.y += velY * step;
      pivot.rotation.x = clamp(pivot.rotation.x + velX * step, -1.25, 1.25);
      const damp = Math.pow(0.93, step);
      velY *= damp;
      velX *= damp;
    } else if (autoRotate) {
      pivot.rotation.y += dt * 0.14;
    }
  }

  renderer.render(scene, camera);
}

/* ============ 啟動 ============ */
async function init() {
  await initDB();
  new ResizeObserver(resize).observe(stage);
  resize();
  requestAnimationFrame(animate);

  // 從本地讀取之前上傳的照片
  const saved = await loadFromDB();
  if (saved.length > 0) {
    saved.forEach(data => {
      const img = new Image();
      img.src = data.thumbUrl;
      img.onload = () => {
        const tex = new THREE.CanvasTexture(img);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        
        pendingFiles.push({ ...data, texture: tex });
        rebuildSphere();
      };
    });
  }
}
init();
</script>
</body>
</html>
